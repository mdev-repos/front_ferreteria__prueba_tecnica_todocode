<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería TodoCode</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>🔧 Ferretería TodoCode</h1>
        <p>Front de práctica — consume la API en <code id="api-url-label"></code></p>
    </header>

    <main>
        <section id="create-section">
            <h2>Agregar herramienta</h2>
            <form id="create-form">
                <div class="form-grid">
                    <label>
                        Nombre
                        <input type="text" name="name" required>
                    </label>
                    <label>
                        Marca
                        <input type="text" name="brand" required>
                    </label>
                    <label>
                        Categoría
                        <select name="category" required>
                            <option value="HAND_TOOL">Herramienta manual</option>
                            <option value="POWER_TOOL">Herramienta eléctrica</option>
                            <option value="BATTERY_TOOL">Herramienta a batería</option>
                            <option value="MEASURING_TOOL">Instrumento de medición</option>
                        </select>
                    </label>
                    <label>
                        Precio
                        <input type="number" name="price" min="0.01" step="0.01" required>
                    </label>
                    <label>
                        Stock
                        <input type="number" name="stock" min="0" step="1" required>
                    </label>
                    <label class="full-width">
                        Descripción
                        <textarea name="description"></textarea>
                    </label>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Crear herramienta</button>
                    <span id="create-feedback" class="feedback"></span>
                </div>
            </form>
        </section>

        <section id="inventory-section">
            <h2>Inventario</h2>
            <div class="table-wrapper">
                <table id="tools-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Marca</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <p id="empty-state" hidden>Todavía no hay herramientas cargadas.</p>
            </div>
        </section>
    </main>

    <footer>
        Proyecto de práctica — Roadmap Java TodoCode
    </footer>

    <dialog id="edit-modal">
        <h2>Editar herramienta</h2>
        <form id="edit-form">
            <input type="hidden" name="id">
            <div class="form-grid">
                <label>
                    Nombre
                    <input type="text" name="name">
                </label>
                <label>
                    Marca
                    <input type="text" name="brand">
                </label>
                <label>
                    Categoría
                    <select name="category">
                        <option value="HAND_TOOL">Herramienta manual</option>
                        <option value="POWER_TOOL">Herramienta eléctrica</option>
                        <option value="BATTERY_TOOL">Herramienta a batería</option>
                        <option value="MEASURING_TOOL">Instrumento de medición</option>
                    </select>
                </label>
                <label>
                    Precio
                    <input type="number" name="price" min="0.01" step="0.01">
                </label>
                <label>
                    Stock
                    <input type="number" name="stock" min="0" step="1">
                </label>
                <label class="full-width">
                    Descripción
                    <textarea name="description"></textarea>
                </label>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Guardar cambios</button>
                <button type="button" id="cancel-edit" class="btn btn-secondary">Cancelar</button>
                <span id="edit-feedback" class="feedback"></span>
            </div>
        </form>
    </dialog>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.querySelector("#api-url-label").textContent = API_BASE_URL;
    </script>
</body>
</html>
